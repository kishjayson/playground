    AND     address != '255.255.255.255';
---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: https://fleetdm.com/tables/file
  discard_data: false
  fleet: ""
  interval: 3600
  logging: snapshot
  min_osquery_version: ""
  name: file
  observer_can_run: true
  platform: darwin
  query: |-
    SELECT  path,
            filename,
            size,
            datetime(mtime, 'unixepoch') AS modified_at
    FROM    file
    WHERE   path LIKE '/Library/Logs/DiagnosticReports/%'
    AND     (filename LIKE '%panic%' OR filename LIKE '%Panic%')
    AND     mtime >= (SELECT unix_time - 604800 FROM time);
---
