apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: https://fleetdm.com/tables/macadmins_unified_log
  discard_data: false
  fleet: ""
  interval: 3600
  logging: snapshot
  min_osquery_version: ""
  name: macadmins_unified_log
  observer_can_run: true
  platform: darwin
  query: |-
    SELECT  datetime(timestamp, 'unixepoch') AS event_time,
            process_image_path,
            subsystem,
            category,
            log_level,
            event_message
    FROM    macadmins_unified_log
    WHERE   last = '1h'
    AND     predicate = 'process == "airportd" OR process == "eapolclient" OR process == "configd" OR subsystem == "com.apple.wifi"'
    ORDER BY timestamp DESC
    LIMIT   500;
---
