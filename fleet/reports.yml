apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: https://fleetdm.com/tables/apps
  discard_data: false
  fleet: ""
  interval: 3600
  logging: snapshot
  min_osquery_version: ""
  name: apps
  observer_can_run: false
  platform: darwin
  query: |-
    SELECT  name,
            path,
            bundle_identifier,
            bundle_short_version,
            datetime(last_opened_time, 'unixepoch') AS last_used_date
    FROM    apps
    WHERE   path NOT LIKE '%/Library/%'
    AND     path NOT LIKE '%/System/%'
    AND     path NOT LIKE '%.app/%';
