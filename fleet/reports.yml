apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: https://fleetdm.com/tables/crashes
  discard_data: false
  fleet: ""
  interval: 3600
  logging: snapshot
  min_osquery_version: ""
  name: crashes
  observer_can_run: true
  platform: darwin
  query: |-
    SELECT  c.type,
            c.pid,
            c.path,
            c.crash_path,
            c.identifier,
            c.datetime,
            c.exception_type,
            c.exception_codes
    FROM    users AS u
    JOIN    crashes AS c ON c.uid = u.uid
    WHERE   (c.path LIKE '%airportd%'
             OR c.path LIKE '%eapolclient%'
             OR c.path LIKE '%configd%'
             OR c.identifier LIKE '%airportd%'
             OR c.identifier LIKE '%eapolclient%'
             OR c.identifier LIKE '%configd%')
    LIMIT   100;
---
apiVersion: v1
