apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: https://fleetdm.com/tables/unified_log
  discard_data: false
  fleet: ""
  interval: 3600
  logging: snapshot
  min_osquery_version: ""
  name: unified_log
  observer_can_run: true
  platform: darwin
  query: |-
    SELECT  datetime(timestamp, 'unixepoch') AS event_time,
            process,
            subsystem,
            level,
            message
    FROM    unified_log
    WHERE   timestamp >= (SELECT unix_time - 3600 FROM time)
    AND     max_rows = 500
    AND     predicate = 'process == "kernel" AND (eventMessage CONTAINS[c] "wlan" OR eventMessage CONTAINS[c] "80211" OR eventMessage CONTAINS[c] "bcm" OR eventMessage CONTAINS[c] "wifi")'
    ORDER BY timestamp DESC
    LIMIT   500;
---
