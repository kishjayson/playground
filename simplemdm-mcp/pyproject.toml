[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "simplemdm-mcp"
version = "0.1.0"
description = "Read-only MCP server for the SimpleMDM API"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=2,<3",
]

[tool.setuptools.packages.find]
include = ["simplemdm_mcp*"]
